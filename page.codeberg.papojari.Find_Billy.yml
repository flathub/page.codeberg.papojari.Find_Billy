app-id: page.codeberg.papojari.Find_Billy
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: godot-runner
rename-icon: find-billy
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
modules:
  - godot-3.5.yaml
  - name: Find-Billy
    buildsystem: simple
    license-files:
      - LICENSE.md
    build-commands:
      - install -Dm644 godot-runner.pck -t /app/bin/
      - install -Dm644 page.codeberg.papojari.Find_Billy.desktop -t /app/share/applications/
      - install -Dm644 page.codeberg.papojari.Find_Billy.appdata.xml -t /app/share/metainfo/
      # Install the icons
      - tar xvf icons.tar.gz
      - install -Dm644 icons/usr/share/icons/hicolor/128x128/apps/find-billy.png -t /app/share/icons/hicolor/128x128/apps/
      - install -Dm644 icons/usr/share/icons/hicolor/512x512/apps/find-billy.png -t /app/share/icons/hicolor/512x512/apps/
    sources:
      - type: archive
        url: https://codeberg.org/papojari/Find-Billy/archive/v0.37.2.tar.gz
        sha256: 2d9e66ee261febf25cc4a56e36c5b2dc143d23456f09f758c59c7b4a46961803
      - type: patch
        path: find-billy-appdata.patch
      - type: file
        url: https://codeberg.org/attachments/d6be6648-359c-49a6-8fba-49c890ab8bf6
        sha256: cc2915ca0a552ea1c68e95f4a13dc2705b8be47d8182d31bde9f9a767d290f88
        dest-filename: godot-runner.pck
      - type: file
        url: https://codeberg.org/attachments/94b09573-d8fe-466e-a9c3-23c2dde203ec
        sha256: 1df8832de0590f1ddf9463781bcaa1feebfc3432f1dca8b21059cd56a3552bad
        dest-filename: icons.tar.gz
